    <meta property="og:title" content="Sarthak Dixit — software engineer" />

    <title>Sarthak Dixit — Software Engineer</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sarthak Dixit",
        "jobTitle": "Software Engineer",
        "description": "Developer and data analyst building RESTful APIs and analytics pipelines, with the cloud infrastructure chops to ship them end-to-end — from first commit to production.",

          "https://github.com/sarthakdixit",
          "https://www.linkedin.com/in/sarthak-dixit-92023218b/"
        ]
      }
    </script>

    <!--
      Anti-flash theme script. Runs synchronously before React hydrates so the
      correct theme class is applied before first paint. Do not remove or move.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          // Dark is always the default. The site loads in dark mode for
          // every visitor unless they have explicitly toggled to light, in
          // which case their stored preference wins.
          var theme = stored === 'light' ? 'light' : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          // localStorage unavailable (private mode); default to dark.
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body class="text-zinc-900 dark:text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
